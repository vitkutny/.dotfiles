plugins:
  exec:
    shortCut: Shift-E
    description: Execute command
    dangerous: true
    scopes:
      - containers
      - pods
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - >-
        ARGUMENT_POD="$(if [ "$POD" = "" ]; then echo "$NAME"; else echo "$POD"; fi)"
        ARGUMENT_CONTAINER="$(if [ "$POD" != "" ]; then echo "--container=$NAME"; fi)"
        KUBECTL_EXEC="kubectl exec $ARGUMENT_POD $ARGUMENT_CONTAINER -it --context $CONTEXT --namespace=$NAMESPACE -- "
        PROMPT=$( \
          POSH_USER_PROMPT_DISABLED=1 oh-my-posh print primary --pwd="$KUBECTL_EXEC" 2>/dev/null \
          || echo -e "[0] $(date +%T)\n$KUBECTL_EXEC" \
        )
        ; reset
        ; while IFS= read -e -r -p "$PROMPT" ARGUMENT_COMMAND; do
          START_TIME=$(date +%s.%N)
          eval $KUBECTL_EXEC $ARGUMENT_COMMAND
          EXIT_CODE=$?
          END_TIME=$(date +%s.%N)
          ELAPSED_SECONDS=$(echo "($END_TIME - $START_TIME)" | bc)
          PROMPT=$( \
            POSH_USER_PROMPT_DISABLED=1 oh-my-posh print primary --pwd="$KUBECTL_EXEC" --status="$EXIT_CODE" --execution-time="$(echo "$ELAPSED_SECONDS * 1000" | bc)" 2>/dev/null \
            || echo -e "[$EXIT_CODE] $(date +%T) [$(printf '%.3f' "$ELAPSED_SECONDS")s]\n$KUBECTL_EXEC" \
          )
          echo
        done

  debug:
    shortCut: Shift-D
    description: Add debug container
    dangerous: true
    scopes:
      - containers
    command: bash
    background: false
    confirm: false
    inputs:
      - name: image
        label: Debug image
        type: dropdown
        required: true
        default: nicolaka/netshoot:latest
        options:
          - nicolaka/netshoot:latest
          - busybox:latest
          - alpine:latest
          - ubuntu:latest
      - name: profile
        label: Debug profile
        type: dropdown
        required: true
        default: sysadmin
        options:
          - general
          - baseline
          - restricted
          - netadmin
          - sysadmin
          - legacy
      - name: share_processes
        label: Share processes
        type: bool
        required: true
        default: true
    args:
      - -c
      - >-
        ARGUMENT_SHARE_PROCESSES=$([ "$INPUT_SHARE_PROCESSES" = "true" ] && echo "--share-processes")
        ; set -x
        ; kubectl debug -it --context $CONTEXT -n=$NAMESPACE $POD --target=$NAME --image=$INPUT_IMAGE --profile=$INPUT_PROFILE $ARGUMENT_SHARE_PROCESSES -- sh -c "cd /proc/1/root; exec sh"
