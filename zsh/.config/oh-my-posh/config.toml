version = 4
final_space = true

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'status'
template = '[{{ .String }}] '
foreground_templates = [ '{{ if .Error }}red{{ else }}green{{ end }}' ]

[blocks.segments.options]
always_enabled = true

[[blocks.segments]]
type = 'executiontime'
foreground = 'yellow'
template = '[{{ .FormattedMs }}] '

[[blocks.segments]]
type = 'text'
foreground = 'darkGray'
template = '{{ if not .Env.POSH_USER_PROMPT_DISABLED }}👤 {{ if .Env.POSH_USER_PROMPT }}{{ .Env.POSH_USER_PROMPT }}{{ else }}{{ .UserName }}@{{ .HostName }}{{ end }}{{ end }}'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'path'
foreground = 'default'
template = '{{ .Path }}'

[blocks.segments.options]
style = 'full'

[[blocks.segments]]
type = 'git'
foreground = 'darkGray'
template = ' {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>'

[blocks.segments.options]
branch_icon = ''
commit_icon = '@'
fetch_status = true

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
foreground = 'darkGray'
template = '❯'

[secondary_prompt]
foreground = 'darkGray'
template = '❯❯ '

[[tooltips]]
type = 'aws'
tips = [ "aws" ]
#foreground = 'darkGray'

[[tooltips]]
type = 'kubectl'
tips = [ "kubectl", "k" ]
foreground = 'darkGray'
