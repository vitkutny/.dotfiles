# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

set-option -g set-titles on
set -s copy-command 'pbcopy'

# window selection from current session only
bind-key w run-shell 'tmux choose-tree -Nwf"##{==:##{session_name},#{session_name}}"'

# Use Shift+arrow keys to switch panes directly
bind-key -n S-Left select-pane -L
bind-key -n S-Right select-pane -R
bind-key -n S-Up select-pane -U
bind-key -n S-Down select-pane -D

# Splitting using Control+Shift+arrow keys without prefix
bind-key -n C-S-Left split-window -hb
bind-key -n C-S-Right split-window -h
bind-key -n C-S-Up split-window -vb
bind-key -n C-S-Down split-window -v

# oh-my-posh status "print primary"
set-option -g status-left '#( \
	execution_running="#{pane_command_running}" \
	execution_start_time="#{pane_command_start_time}" \
	session_name="#{session_name}" \
	detached_session_count="$(tmux list-sessions -F "##{session_name}" -f "##{==:##{session_attached},0}" | wc -l | tr -d " ")" \
	pane_index="#{pane_index}" \
	pane_title="#{pane_title}" \
	oh-my-posh print primary \
		#{?#{!=:#{pane_command_status},},--status #{pane_command_status},--no-status --pipestatus="X"} \
		#{?pane_command_duration,--execution-time #{e|*|f|0:#{pane_command_duration},1000}} \
		--pwd="#{pane_current_path}" \
		--command="#{pane_current_command}" \
		--config=~/.config/tmux/oh-my-posh/config.toml \
	| ansi-colors-to-tmux) '
# oh-my-posh status "print primary"
set-option -g status-right ' #( \
	execution_running="#{pane_command_running}" \
	execution_start_time="#{pane_command_start_time}" \
	session_name="#{session_name}" \
	detached_session_count="$(tmux list-sessions -F "##{session_name}" -f "##{==:##{session_attached},0}" | wc -l | tr -d " ")" \
	pane_index="#{pane_index}" \
	pane_title="#{pane_title}" \
	oh-my-posh print right \
		#{?#{!=:#{pane_command_status},},--status #{pane_command_status},--no-status --pipestatus="X"} \
		#{?pane_command_duration,--execution-time #{e|*|f|0:#{pane_command_duration},1000}} \
		--pwd="#{pane_current_path}" \
		--command="#{pane_current_command}" \
		--config=~/.config/tmux/oh-my-posh/config.toml \
	| ansi-colors-to-tmux)'

set -g status-style default
# Enable a 2-line status bar
set -g status 2
# Move your original status bar content to the bottom line (index 1)
set -Fg 'status-format[1]' '#{status-format[0]}'
# Make the top line (index 0) blank and match the terminal's background color
set -g 'status-format[0]' '#[fill=terminal]'

# refresh on OSC 133 hooks
set-hook -g pane-command-finished { refresh-client -S }
set-hook -g pane-command-started { refresh-client -S }
set-hook -g pane-shell-prompt { refresh-client -S }
