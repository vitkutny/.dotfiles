version = 4

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
type = 'text'
background = '#ddd'
foreground = '#000'
template = " {{ .Env.session_name }} "

[[blocks.segments]]
type = 'status'
template = ' [{{ .String }}]'
foreground_templates = [ '{{ if .Error }}red{{ else }}green{{ end }}' ]

[blocks.segments.options]
always_enabled = true

[[blocks.segments]]
type = 'time'
foreground = 'yellow'
template = "{{ if .Env.execution_timestamp }} [{{ .Env.execution_timestamp | date .Format }}]{{ end }}"

[blocks.segments.options]
time_format = "15:04"

[[blocks.segments]]
type = 'executiontime'
foreground = 'yellow'
template = ' [{{ .FormattedMs }}]'

[[blocks.segments]]
type = 'text'
background = '#f00'
foreground = '#fff'
template = '{{ if and .Env.detached_session_count (ne .Env.detached_session_count "0") }} +{{ .Env.detached_session_count }}! {{ end }}'

[[blocks]]
type = 'rprompt'
alignment = 'left'

[[blocks.segments]]
type = 'taskwarrior'
background = '#0f0'
foreground = '#000'
template = "{{ if .Commands.Prompt }} 💻 {{ .Commands.Prompt }} {{ end }}"

[blocks.segments.options.commands]
prompt = "rc.context=none rc.verbose=off rc.color=off prompt"

[[blocks.segments]]
type = 'text'
background = 'default'
foreground = 'default'
template = " {{ .Env.pane_index }}:{{ .Env.pane_title }} "

[[blocks.segments]]
type = 'time'
background = '#ddd'
foreground = '#000'

[blocks.segments.options]
time_format = "15:04"
